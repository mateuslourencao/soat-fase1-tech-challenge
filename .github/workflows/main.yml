name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run tests
        run: mvn -B test

  sonarcloud:
    name: SonarCloud analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Analyze with SonarCloud
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=mateuslourencao_soat-fase1-tech-challenge
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build and deploy to temporary Kubernetes cluster
    needs: sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        run: mvn -B package -DskipTests
      - name: Build Docker image
        run: |
          docker build \
            --tag soat-fase1-tech-challenge-app:dev \
            --tag soat-fase1-tech-challenge-app:${GITHUB_SHA} .
          docker image inspect soat-fase1-tech-challenge-app:${GITHUB_SHA}
      - name: Install Kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
      - name: Create temporary Kind cluster
        run: kind create cluster --name oficina-ci --wait 120s
      - name: Install Metrics Server for Kind
        run: |
          kubectl --context kind-oficina-ci apply \
            -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl --context kind-oficina-ci patch deployment metrics-server \
            -n kube-system \
            --type=json \
            --patch='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl --context kind-oficina-ci rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s
          for attempt in $(seq 1 18); do
            if kubectl --context kind-oficina-ci top nodes; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Metrics Server did not provide node metrics within 3 minutes" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Load application image into Kind
        run: kind load docker-image soat-fase1-tech-challenge-app:dev --name oficina-ci
      - name: Apply Kubernetes manifests
        run: kubectl --context kind-oficina-ci apply -k .
      - name: Wait for database deployment
        run: kubectl --context kind-oficina-ci rollout status deployment/oficina-db --timeout=180s
      - name: Wait for application deployment
        run: kubectl --context kind-oficina-ci rollout status deployment/oficina-api --timeout=240s
      - name: Wait for MailHog deployment
        run: kubectl --context kind-oficina-ci rollout status deployment/mailhog --timeout=120s
      - name: Confirm HPA was applied
        run: kubectl --context kind-oficina-ci get hpa oficina-api
      - name: Delete temporary Kind cluster
        if: always()
        run: kind delete cluster --name oficina-ci || true
