services:
  mailhog:
    image: mailhog/mailhog
    container_name: oficina-mailhog
    restart: no
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - oficina-db-network
  app:
    build: .
    container_name: oficina-app
    restart: no
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/oficina?createDatabaseIfNotExist=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_SMTP_AUTH=false
      - MAIL_SMTP_STARTTLS=false
    depends_on:
      - mailhog
    networks:
      - oficina-db-network

networks:
  oficina-db-network:
    external: true
    name: oficina-db-network
