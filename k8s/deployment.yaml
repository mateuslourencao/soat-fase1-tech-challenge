apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      initContainers:
        - name: aguardar-mysql
          image: busybox:1.36
          command: [ "sh", "-c", "until nc -z oficina-db-svc 3306; do echo 'Aguardando MySQL...'; sleep 2; done" ]
      containers:
        - name: oficina-api
          image: soat-fase1-tech-challenge-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: oficina-configmap
            - secretRef:
                name: oficina-db-secret
            - secretRef:
                name: oficina-api-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
