apiVersion: v1
kind: Service
metadata:
  name: oficina-api-svc
spec:
  selector:
    app: oficina-api
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-db-svc
spec:
  selector:
    app: oficina-db
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306